server:
  port: 9090                          # 服务端口（老师要求9090）
  servlet:
    session:
      timeout: 30m                    # Session超时时间30分钟

spring:
  # 允许抛出404异常（让NoHandlerFoundException被全局异常处理器捕获）
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 数据源配置
  # 账号密码不写死在代码里：优先读环境变量，读不到则用冒号后的默认值（本地开发用）
  # 队友拉下代码后可自行设置 DB_USERNAME / DB_PASSWORD 环境变量，或直接改默认值
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB          # 单个文件最大5MB
      max-request-size: 20MB      # 单次请求最大20MB
  # Jackson 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 文件上传相关配置
# 使用相对路径 ./upload（相对于项目启动目录），避免写死某台机器的绝对路径导致队友跑不起来；
# 如需指定绝对路径，可设置环境变量 FILE_UPLOAD_PATH
file:
  upload-path: ${FILE_UPLOAD_PATH:./upload}   # 上传文件存储目录

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML文件路径
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.example.blog.entity
  configuration:
    # 驼峰命名转换（数据库下划线 -> Java驼峰）
    map-underscore-to-camel-case: true
    # SQL日志输出（开发环境使用，上线后可关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.example.blog: debug
